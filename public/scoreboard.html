<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bảng điểm bóng rổ — vMix / OBS</title>
  <link rel="stylesheet" href="/fonts.css?v=12" />
  <link rel="stylesheet" href="/scoreboard.css?v=12" />
</head>
<body>
  <!--
    Tham số URL (tùy chọn):
      ?scale=1.0        phóng to / thu nhỏ
      ?x=60&y=60        khoảng cách tới cạnh trái / dưới (px)
  -->
  <div id="stage" class="stage">
    <div id="board" class="sb is-hidden">

      <!-- HÀNG TRÊN: U16 | INVITATION CUP | 10:00 -->
      <div class="row header">
        <div class="box box--dark box--u16"><span data-el="category">U16</span></div>
        <div class="box box--dark box--cup"><span data-el="tournament">INVITATION CUP</span></div>
        <div class="box box--dark box--clock"><span data-el="clock">10:00</span></div>
      </div>

      <!-- ĐỘI 1 -->
      <div class="row team">
        <div class="chip" data-el="home-chip"></div>
        <div class="box box--dark box--name"><span data-el="home-name"></span></div>
        <div class="box box--score"><span data-el="home-score">0</span></div>
        <div class="box box--fouls"><span class="fl">Fouls</span><span class="fn" data-el="home-fouls">0</span></div>
      </div>

      <!-- ĐỘI 2 -->
      <div class="row team">
        <div class="chip" data-el="away-chip"></div>
        <div class="box box--dark box--name"><span data-el="away-name"></span></div>
        <div class="box box--score"><span data-el="away-score">0</span></div>
        <div class="box box--fouls"><span class="fl">Fouls</span><span class="fn" data-el="away-fouls">0</span></div>
      </div>

    </div>
  </div>

  <script src="/scoreboard.js?v=12"></script>
</body>
</html>
